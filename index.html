<title>迈凯伦新语</title>
<style>
:root {
  --paper: #f5f0e8;
  --ink: #3a3226;
  --ink-light: #6b5e4a;
  --accent: #b5343a;
  --accent-light: #d4a0a0;
  --card-bg: #faf7f0;
  --border: #d4c8b0;
  --shadow: rgba(58,50,38,0.08);
  --tag-bg: #ede4d3;
  --sidebar-w: 260px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", "宋体", serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
}

/* ── 侧边栏 ── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: linear-gradient(180deg, #ede4d3 0%, #f5f0e8 100%);
  border-right: 1px solid var(--border);
  padding: 28px 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  z-index: 10;
}
.sidebar h2 {
  font-size: 1.4em;
  color: var(--accent);
  letter-spacing: 0.15em;
  text-align: center;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--accent-light);
}
.search-box {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card-bg);
  font-family: inherit;
  font-size: 0.95em;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: #b8a890; }

.mode-switch {
  display: flex;
  gap: 4px;
  background: var(--tag-bg);
  border-radius: 6px;
  padding: 3px;
}
.mode-switch button {
  flex: 1;
  padding: 7px 4px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.82em;
  color: var(--ink-light);
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
}
.mode-switch button.active {
  background: var(--card-bg);
  color: var(--ink);
  box-shadow: 0 1px 3px var(--shadow);
  font-weight: bold;
}

.char-list { flex:1; overflow-y:auto; }
.char-list .section-title {
  font-size: 0.75em;
  color: #a09080;
  letter-spacing: 0.1em;
  margin: 16px 0 8px;
  text-transform: uppercase;
}
.char-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 9px 14px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.95em;
  color: var(--ink);
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.15s;
  text-align: left;
}
.char-btn:hover { background: var(--tag-bg); }
.char-btn.active {
  background: var(--accent);
  color: #fff;
}
.char-btn .count {
  font-size: 0.78em;
  opacity: 0.6;
  min-width: 24px;
  text-align: center;
}
.char-btn.active .count { opacity: 0.9; }
.char-btn.all-btn {
  font-weight: bold;
  margin-bottom: 4px;
  color: var(--accent);
}
.char-btn.all-btn.active {
  background: var(--accent);
  color: #fff;
}

.result-info {
  font-size: 0.8em;
  color: #a09080;
  text-align: center;
  padding: 8px 0;
}

/* ── 主内容区 ── */
.main {
  flex: 1;
  padding: 32px 40px 60px;
  max-width: 900px;
  margin: 0 auto;
}
.main-header {
  text-align: center;
  margin-bottom: 36px;
}
.main-header h1 {
  font-size: 2.2em;
  letter-spacing: 0.2em;
  color: var(--accent);
  margin-bottom: 6px;
}
.main-header .subtitle {
  font-size: 0.9em;
  color: #a09080;
  letter-spacing: 0.05em;
}

/* ── 条目卡片 ── */
.entry-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px 28px;
  margin-bottom: 20px;
  transition: box-shadow 0.2s, transform 0.15s;
  position: relative;
}
.entry-card:hover {
  box-shadow: 0 4px 20px var(--shadow);
  transform: translateY(-1px);
}
.entry-card.hidden { display: none; }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 12px;
}
.card-title {
  font-size: 1.05em;
  color: var(--ink);
  font-weight: bold;
  letter-spacing: 0.05em;
  flex: 1;
  min-width: 0;
}
.card-title .num {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  min-width: 28px; height: 28px;
  line-height: 28px;
  text-align: center;
  border-radius: 50%;
  font-size: 0.8em;
  margin-right: 8px;
  padding: 0 4px;
}
.card-dates {
  font-size: 0.78em;
  color: #a09080;
  white-space: nowrap;
}

.original-text {
  font-size: 1.15em;
  line-height: 2;
  color: var(--ink);
  margin-bottom: 8px;
  letter-spacing: 0.03em;
}
.translation-text {
  font-size: 0.95em;
  line-height: 1.85;
  color: var(--ink-light);
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  margin-top: 4px;
}
.translation-text.collapsed { display: none; }
.translation-toggle {
  display: inline-block;
  font-size: 0.78em;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
  margin-left: 6px;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.translation-toggle:hover { opacity: 1; }

/* ── 脚注 ── */
.fn-marker {
  color: var(--accent);
  font-size: 0.7em;
  vertical-align: super;
  cursor: pointer;
  font-weight: bold;
  margin: 0 1px;
  transition: color 0.15s;
}
.fn-marker:hover { color: #e05050; }

.fn-popup {
  display: none;
  position: absolute;
  max-width: 380px;
  min-width: 200px;
  background: #fdf6e3;
  border: 1px solid #e6d5a8;
  border-radius: 8px;
  padding: 12px 16px;
  box-shadow: 0 4px 20px rgba(58,50,38,0.18);
  z-index: 100;
  font-size: 0.88em;
  line-height: 1.75;
  color: var(--ink);
}
.fn-popup.show { display: block; }
.fn-popup .fn-id {
  font-weight: bold;
  color: var(--accent);
  margin-right: 8px;
}
.fn-popup .fn-close {
  position: absolute;
  top: 8px; right: 12px;
  cursor: pointer;
  font-size: 1.2em;
  color: #b8a890;
  background: none;
  border: none;
}
.fn-popup .fn-close:hover { color: var(--ink); }

.fn-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  cursor: pointer;
  font-size: 0.88em;
  color: var(--ink-light);
  user-select: none;
}
.fn-toggle input { display: none; }
.fn-toggle .fn-check {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.fn-toggle .fn-check::after {
  content: '✓';
  font-size: 12px;
  color: transparent;
  transition: color 0.15s;
}
.fn-toggle input:checked + .fn-check {
  background: var(--accent);
  border-color: var(--accent);
}
.fn-toggle input:checked + .fn-check::after {
  color: #fff;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
}
.char-tag {
  display: inline-block;
  padding: 3px 10px;
  background: var(--tag-bg);
  color: var(--ink-light);
  font-size: 0.8em;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.char-tag:hover {
  background: var(--accent);
  color: #fff;
}
.char-tag.other-char {
  background: transparent;
  border: 1px dashed var(--border);
  font-size: 0.75em;
}

.no-results {
  text-align: center;
  padding: 60px 20px;
  color: #b8a890;
  font-size: 1.1em;
}
.no-results .icon { font-size: 2.5em; display:block; margin-bottom:12px; }

.mobile-menu-btn {
  display: none;
  position: fixed;
  top: 16px; left: 16px;
  z-index: 20;
  width: 40px; height: 40px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 1.2em;
  cursor: pointer;
}

@media (max-width: 768px) {
  body { flex-direction: column; }
  .sidebar {
    position: fixed;
    left: -280px;
    transition: left 0.3s;
    width: 280px;
    min-width: 280px;
    height: 100vh;
    z-index: 15;
  }
  .sidebar.open { left: 0; box-shadow: 4px 0 30px rgba(0,0,0,0.15); }
  .mobile-menu-btn { display: flex; align-items:center; justify-content:center; }
  .main { padding: 20px 16px 40px; }
  .main-header h1 { font-size: 1.6em; }
  .entry-card { padding: 18px 16px; }
  .original-text { font-size: 1.05em; }
}

.footer {
  text-align: center;
  padding: 40px 20px 30px;
  color: #b8a890;
  font-size: 0.82em;
  letter-spacing: 0.05em;
  border-top: 1px solid var(--border);
  margin-top: 20px;
}
</style>
</head>

<button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')" title="菜单">☰</button>

// ── 渲染人物列表 ──
(function renderCharList() {
  const list = document.getElementById('charList');
  for (const name of DATA.charNames) {
    const btn = document.createElement('button');
    btn.className = 'char-btn';
    btn.innerHTML = `${name} <span class="count">${DATA.charCounts[name]}</span>`;
    btn.onclick = () => selectChar(name, btn);
    list.appendChild(btn);
  }
})();

// ── 提取首句 ──
function getFirstSentence(text) {
  const m = text.match(/^(.+?)[，。：？！；]/);
  return m ? m[1] : text.slice(0, 20);
}

// ── 插入脚注标记 ──
function insertFootnotes(text, footnotes) {
  if (!footnotes || footnotes.length === 0) return escapeHTML(text);
  const showFn = document.getElementById('fnToggle').checked;
  if (!showFn) return escapeHTML(text);

  // 按位置从后往前插入，避免位置偏移；使用局部编号
  const sorted = [...footnotes].sort((a, b) => b.pos - a.pos);
  let result = escapeHTML(text);
  let localNum = sorted.length;
  for (const fn of sorted) {
    const marker = `<sup class="fn-marker" data-fn="${fn.fnId}" onclick="event.stopPropagation();showFnPopup(${fn.fnId})">[${localNum}]</sup>`;
    result = result.slice(0, fn.pos) + marker + result.slice(fn.pos);
    localNum--;
  }
  return result;
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 脚注弹窗 ──
function showFnPopup(fnId) {
  const popup = document.getElementById('fnPopup');
  const content = document.getElementById('fnPopupContent');
  const fnText = DATA.footnotes && DATA.footnotes[fnId];
  const marker = document.querySelector(`.fn-marker[data-fn="${fnId}"]`);
  if (fnText && marker) {
    content.innerHTML = escapeHTML(fnText);
    popup.classList.add('show');
    
    const rect = marker.getBoundingClientRect();
    const scrollLeft = window.pageXOffset;
    const scrollTop = window.pageYOffset;
    const popupW = popup.offsetWidth || 380;
    
    let left = rect.left + scrollLeft;
    let top = rect.bottom + scrollTop + 4;
    
    // 避免超出右边界
    if (left + popupW > window.innerWidth + scrollLeft - 16) {
      left = window.innerWidth + scrollLeft - popupW - 16;
    }
    if (left < scrollLeft + 8) left = scrollLeft + 8;
    
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }
}

function closeFnPopup() {
  const popup = document.getElementById('fnPopup');
  popup.classList.remove('show');
  popup.style.left = '';
  popup.style.top = '';
}

// 点击其他地方关闭弹窗
document.addEventListener('click', (e) => {
  if (!e.target.closest('.fn-marker') && !e.target.closest('.fn-popup')) {
    closeFnPopup();
  }
});

// ── 渲染条目 ──
function render(entries) {
  const container = document.getElementById('entryContainer');
  container.innerHTML = '';

  if (entries.length === 0) {
    container.innerHTML = '<div class="no-results"><span class="icon">📭</span>没有匹配的条目</div>';
    document.getElementById('resultInfo').textContent = '无结果';
    return;
  }

  document.getElementById('resultInfo').textContent = `显示 ${entries.length} / ${DATA.total} 条`;

  const titleCount = {};
  for (const e of entries) {
    const card = document.createElement('div');
    card.className = 'entry-card';
    card.id = 'entry-' + e.id;

    const showOrig = currentMode === 'all' || currentMode === 'original';
    const showTrans = currentMode === 'all' || currentMode === 'translation';

    let tagsHTML = '';
    for (const c of e.characters) {
      tagsHTML += `<span class="char-tag" onclick="event.stopPropagation();selectCharByName('${c}')">${c}</span>`;
    }
    if (e.otherChars) {
      for (const c of e.otherChars.split(/[、,，]/)) {
        const t = c.trim();
        if (t) tagsHTML += `<span class="char-tag other-char">${t}</span>`;
      }
    }

    const transToggle = (showOrig && showTrans)
      ? `<span class="translation-toggle" onclick="const card=this.closest('.entry-card'); const t=card.querySelector('.translation-text'); t.classList.toggle('collapsed'); this.textContent = t.classList.contains('collapsed')?'▶ 译文':'▼ 译文'">▶ 译文</span>`
      : '';

    let title = getFirstSentence(e.original) || e.order;
    if (e.id === 17) title = '我闻强尼言';
    titleCount[title] = (titleCount[title] || 0) + 1;
    if (titleCount[title] > 1) title += ' 其二';

    const origHTML = showOrig
      ? insertFootnotes(e.original, e.footnotes || [])
      : '';

    card.innerHTML = `
      <div class="card-header">
        <span class="card-title"><span class="num">${e.id}</span>${title}</span>
        <span class="card-dates">${e.eventDate || ''}</span>
      </div>
      ${showOrig ? `<div class="original-text">${highlight(origHTML)}${transToggle}</div>` : ''}
      ${showTrans ? `<div class="translation-text ${showOrig ? 'collapsed' : ''}">${highlight(e.translation)}</div>` : ''}
      <div class="card-tags">${tagsHTML}</div>
    `;
    container.appendChild(card);
  }
}

function highlight(text) {
  if (!currentSearch) return text;
  const escaped = currentSearch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // 分割标签和文本，只对文本部分高亮
  const parts = text.split(/(<[^>]+>)/g);
  for (let i = 0; i < parts.length; i++) {
    if (!parts[i].startsWith('<')) {
      parts[i] = parts[i].replace(new RegExp(`(${escaped})`, 'gi'), '<mark style="background:#f9e79f;padding:0 2px;border-radius:2px;">$1</mark>');
    }
  }
  return parts.join('');
}

// ── 筛选逻辑 ──
function filter() {
  currentSearch = document.getElementById('searchInput').value.trim();
  let entries = DATA.entries;

  if (currentChar) {
    entries = entries.filter(e => e.characters.includes(currentChar));
  }

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    entries = entries.filter(e =>
      e.original.toLowerCase().includes(q) ||
      e.translation.toLowerCase().includes(q)
    );
  }

  // 排序
  if (currentSort === 'event') {
    entries = [...entries].sort((a, b) => {
      const da = a.eventDate || '9999';
      const db = b.eventDate || '9999';
      return da.localeCompare(db) || a.id - b.id;
    });
  }

  render(entries);
}

function selectChar(name, btn) {
  currentChar = name;
  document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector('.all-btn').classList.add('active');
  filter();
}

function selectCharByName(name) {
  currentChar = name;
  document.querySelectorAll('.char-btn').forEach(b => {
    b.classList.remove('active');
    if (b.textContent.trim().startsWith(name)) b.classList.add('active');
  });
  filter();
  // 移动端关闭侧栏
  document.querySelector('.sidebar').classList.remove('open');
}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filter();
}

function setSort(sort, btn) {
  currentSort = sort;
  document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filter();
}

// ── 点击主区域关闭侧栏 ──
document.querySelector('.main').addEventListener('click', () => {
  document.querySelector('.sidebar').classList.remove('open');
});

// ── 初始渲染 ──
render(DATA.entries);
</script>
